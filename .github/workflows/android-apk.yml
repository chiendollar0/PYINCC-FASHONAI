name: Test Debug and Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Test asset rights and actual APK integrity gates
        run: python3 -m unittest discover -s tests -v

  asset-gate:
    needs: gate-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Require reviewed rights and exactly one approved GLB
        run: python3 scripts/avatar_gate.py --report build/evidence/avatar-gate.json
      - name: Preserve asset gate evidence including BLOCKED reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashionai-asset-gate
          path: build/evidence/avatar-gate.json
          if-no-files-found: error
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold without overwriting app dependencies
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pyincc-pubspec.yaml
          flutter create --platforms=android --org com.pyincc --project-name pyincc_fashionai --no-pub .
          cp /tmp/pyincc-pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
      - name: Configure Android application ID
        run: |
          sed -i 's/com.pyincc.pyincc_fashionai/com.pyincc.fashionai/g' android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/pyincc/fashionai
          rm -f android/app/src/main/kotlin/com/pyincc/pyincc_fashionai/MainActivity.kt
      - name: Enable local 3D model viewer WebView
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
      - name: Set Android 8 minimum SDK (API 26)
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          grep -Eq 'minSdk = 26' android/app/build.gradle.kts
      - name: Validate launcher configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/kotlin/com/pyincc/fashionai/MainActivity.kt
          grep -q 'package com.pyincc.fashionai' android/app/src/main/kotlin/com/pyincc/fashionai/MainActivity.kt
          grep -q 'class MainActivity : FlutterActivity()' android/app/src/main/kotlin/com/pyincc/fashionai/MainActivity.kt
          grep -q 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.pyincc.fashionai"' android/app/build.gradle.kts
          grep -q 'minSdk = 26' android/app/build.gradle.kts
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Flutter dependency resolution
        shell: bash
        run: |
          flutter pub deps --style=compact
          grep -q "flutter_lints:" pubspec.yaml
          flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test --dart-define=PYINCC_WIDGET_TEST=true
      - name: Android Gradle compile check
        working-directory: android
        run: bash ./gradlew :app:compileDebugKotlin --stacktrace

  build:
    needs: [validate, asset-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Recheck approved asset without regenerating old scans
        run: python3 scripts/avatar_gate.py --report build/evidence/avatar-source.json
      - name: Generate Android scaffold without overwriting app dependencies
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pyincc-pubspec.yaml
          flutter create --platforms=android --org com.pyincc --project-name pyincc_fashionai --no-pub .
          cp /tmp/pyincc-pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
      - name: Configure Android application ID
        run: |
          sed -i 's/com.pyincc.pyincc_fashionai/com.pyincc.fashionai/g' android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/pyincc/fashionai
          rm -f android/app/src/main/kotlin/com/pyincc/pyincc_fashionai/MainActivity.kt
      - name: Enable local 3D model viewer WebView
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
      - name: Set Android 8 minimum SDK (API 26)
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          grep -Eq 'minSdk = 26' android/app/build.gradle.kts
      - name: Dependencies
        run: flutter pub get
      - name: Build debug APK only after tests pass
        run: flutter build apk --debug
      - name: Verify exact GLB bytes inside actual APK and record raw APK hash
        run: python3 scripts/avatar_gate.py --apk build/app/outputs/flutter-apk/app-debug.apk --report build/evidence/apk-integrity.json
      - name: Verify Android package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          FASHION_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$FASHION_SDK"
          FASHION_APKSIGNER="$(find "$FASHION_SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          FASHION_ANALYZER="$(find "$FASHION_SDK/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$FASHION_APKSIGNER"
          test -x "$FASHION_ANALYZER"
          "$FASHION_APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk > build/evidence/apk-signature.txt
          "$FASHION_ANALYZER" apk summary build/app/outputs/flutter-apk/app-debug.apk > build/evidence/apk-identity.txt
          "$FASHION_ANALYZER" manifest min-sdk build/app/outputs/flutter-apk/app-debug.apk > build/evidence/apk-min-sdk.txt
          python3 - <<'PY'
          from pathlib import Path
          summary = Path('build/evidence/apk-identity.txt').read_text().split()
          if not summary or summary[0] != 'com.pyincc.fashionai':
              raise SystemExit('APK_IDENTITY_FAIL: package is not FashionAI')
          if Path('build/evidence/apk-min-sdk.txt').read_text().strip() != '26':
              raise SystemExit('APK_IDENTITY_FAIL: min SDK must be 26')
          PY
      - name: Upload build identity and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashionai-build-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pyincc-fashionai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

